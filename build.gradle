plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.16'
}

group = 'com.otectus.plantfiber'
version = mod_version

base {
    archivesName = 'plantfiber'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                plantfiber {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                plantfiber {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'plantfiber', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                plantfiber {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Expand the gradle.properties version pins into the packaged metadata so no version literal
// is duplicated in a resource file.
tasks.named('processResources', ProcessResources).configure {
    def expansions = [
            mod_version            : mod_version,
            loader_version_range   : loader_version_range,
            forge_version_range    : forge_version_range,
            minecraft_version_range: minecraft_version_range
    ]
    inputs.properties expansions
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expansions
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    // The development verification fixture never ships.
    exclude 'com/otectus/plantfiber/dev/**'

    manifest {
        attributes([
                'Specification-Title'     : 'plantfiber',
                'Specification-Vendor'    : 'Otectus',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Otectus'
        ])
    }
}


